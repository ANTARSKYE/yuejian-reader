plugins { id 'com.android.application' }

android {
    namespace 'com.yuejian.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yuejian.reader'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // Android 8.0 is the minimum supported version. Keeping the adaptive
        // icon in v26 plus a bitmap fallback avoids launcher incompatibilities.
        disable 'ObsoleteSdkInt', 'IconXmlAndPng'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
