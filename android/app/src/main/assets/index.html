<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: https://app.local; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>阅见</title>
  <link rel="stylesheet" href="/features.css">
  <style>
    :root{--paper:#f5efe5;--surface:#fffaf2;--ink:#29231f;--muted:#786e65;--brand:#73533b;--accent:#d69a5b;--line:rgba(63,47,37,.13);--shadow:0 12px 36px rgba(56,38,24,.12);--reader-size:19px;--reader-line:1.95;--reader-width:720px}
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);overscroll-behavior:none}button,input{font:inherit}button{color:inherit}.hidden{display:none!important}.screen{height:100%;overflow:auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
    .brand-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:15px;background:var(--brand);color:#fff9ef;display:grid;place-items:center;font-family:serif;font-size:25px;box-shadow:0 8px 24px rgba(115,83,59,.25)}h1{font-family:serif;font-weight:650;font-size:30px;margin:0;letter-spacing:.06em}.tagline{color:var(--muted);font-size:13px;margin-top:3px}
    .icon-btn,.round-btn{border:0;background:var(--surface);box-shadow:0 5px 18px rgba(55,39,27,.1);display:grid;place-items:center}.icon-btn{width:43px;height:43px;border-radius:14px;font-size:20px}.round-btn{width:42px;height:42px;border-radius:50%;font-size:18px}.hero{position:relative;border-radius:26px;padding:24px;background:linear-gradient(145deg,#71513a,#9b7253);color:#fff8ee;overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px}.hero:after{content:"阅";position:absolute;right:-5px;bottom:-45px;font:140px/1 serif;opacity:.09}.hero h2{font:600 22px/1.4 serif;margin:0 0 8px}.hero p{margin:0 0 20px;color:#f2dfce;font-size:14px;line-height:1.7;max-width:75%}.primary{border:0;border-radius:14px;padding:12px 18px;background:#f6d3a8;color:#4b3525;font-weight:700;box-shadow:0 5px 16px rgba(25,15,8,.17)}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:0 2px 14px}.section-title h2{font:600 21px serif;margin:0}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.book{border:0;background:transparent;text-align:left;padding:0;min-width:0}.cover{aspect-ratio:3/4.15;border-radius:9px 16px 16px 9px;background:linear-gradient(150deg,#856147,#5d4333);box-shadow:5px 8px 18px rgba(50,34,23,.19);position:relative;padding:17px 13px;color:#fff9f0;overflow:hidden}.cover:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.2);box-shadow:2px 0 rgba(0,0,0,.12)}.cover.epub{background:linear-gradient(150deg,#54706a,#354c49)}.cover-title{position:relative;font:600 17px/1.5 serif;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.cover-type{position:absolute;bottom:13px;right:12px;font-size:10px;letter-spacing:.12em;opacity:.68}.book-name{font:600 15px/1.4 serif;margin:11px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress-row{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.bar{height:3px;flex:1;background:rgba(70,52,40,.12);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.empty{text-align:center;padding:38px 15px;color:var(--muted);grid-column:1/-1}.empty .empty-icon{font-size:48px;opacity:.5;margin-bottom:12px}
    #reader{height:100%;background:var(--paper);display:flex;flex-direction:column}.reader-head{height:calc(62px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:grid;grid-template-columns:45px 1fr 92px;align-items:center;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 94%,transparent);z-index:5}.reader-title{text-align:center;min-width:0}.reader-title strong{display:block;font:600 15px serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader-title span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.head-actions{display:flex;justify-content:flex-end;gap:4px}.head-actions button,.back{border:0;background:transparent;font-size:21px;width:42px;height:42px;border-radius:50%}.reading-scroll{flex:1;overflow:auto;scroll-behavior:smooth;padding:30px 22px 100px}.reading{max-width:var(--reader-width);margin:auto;font:400 var(--reader-size)/var(--reader-line) Georgia,"Noto Serif SC","Songti SC",serif;letter-spacing:.02em;word-break:break-word}.reading h1,.reading h2,.reading h3{font-family:Georgia,"Noto Serif SC",serif;line-height:1.45;margin:1.4em 0 .8em}.reading h2:first-child{margin-top:0}.reading p{text-indent:2em;margin:0 0 1.05em}.reading img,.reading svg{max-width:100%;height:auto;display:block;margin:1.5em auto}.reading a{color:var(--brand)}.reader-foot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(49,40,34,.91);border-radius:24px;padding:6px;box-shadow:0 8px 26px rgba(0,0,0,.22);z-index:4}.reader-foot button{border:0;color:white;background:transparent;border-radius:18px;padding:9px 14px;font-size:13px}.reader-foot button:disabled{opacity:.35}.reader-foot .chapter-page{color:#ddd1c7;font-size:11px;min-width:54px;text-align:center}
    .reader-head{grid-template-columns:45px 1fr 126px;background:var(--paper)}.head-actions{gap:0}.head-actions button{width:40px;font-size:20px}
    .overlay{position:fixed;inset:0;background:rgba(30,24,20,.37);z-index:10;opacity:0;pointer-events:none;transition:.2s}.overlay.show{opacity:1;pointer-events:auto}.drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,380px);background:var(--surface);transform:translateX(-102%);transition:.25s;box-shadow:var(--shadow);padding:calc(24px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}.overlay.show .drawer{transform:none}.drawer h2{font:600 24px serif;margin:0 22px 17px}.toc{overflow:auto;flex:1}.toc button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px 22px;color:var(--muted);border-left:3px solid transparent}.toc button.active{color:var(--brand);background:rgba(115,83,59,.08);border-left-color:var(--brand);font-weight:650}
    .sheet-wrap{position:fixed;inset:0;background:rgba(30,24,20,.37);z-index:12;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.2s}.sheet-wrap.show{opacity:1;pointer-events:auto}.sheet{width:100%;background:var(--surface);border-radius:25px 25px 0 0;padding:20px 22px calc(25px + env(safe-area-inset-bottom));transform:translateY(102%);transition:.25s;box-shadow:0 -10px 35px rgba(0,0,0,.14)}.sheet-wrap.show .sheet{transform:none}.grab{width:38px;height:4px;border-radius:3px;background:#c7beb5;margin:0 auto 18px}.setting{margin:18px 0}.setting label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:11px}.setting input[type=range]{width:100%;accent-color:var(--brand)}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.theme{border:2px solid transparent;border-radius:13px;padding:12px 5px;text-align:center;font-size:12px}.theme.active{border-color:var(--brand)}.theme i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 7px;border:1px solid rgba(0,0,0,.12)}
    .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#302823;color:white;padding:11px 17px;border-radius:22px;font-size:13px;z-index:30;opacity:0;transition:.2s;max-width:85%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.busy{position:fixed;inset:0;background:rgba(245,239,229,.88);z-index:25;display:grid;place-items:center}.busy-card{text-align:center}.spinner{width:42px;height:42px;border:4px solid #d8cbbc;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
    body[data-theme=night]{--paper:#171a1c;--surface:#222629;--ink:#dcd8d1;--muted:#9b9790;--brand:#c09a78;--accent:#c59a6c;--line:rgba(255,255,255,.09)}body[data-theme=green]{--paper:#e8efe7;--surface:#f3f8f1;--ink:#28342a;--muted:#68766a;--brand:#45634c;--accent:#76906f}body[data-theme=white]{--paper:#fafafa;--surface:#fff;--ink:#202020;--muted:#727272;--brand:#454545;--accent:#777}
    @media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.screen{max-width:920px;margin:auto}.hero p{max-width:50%}}
  </style>
</head>
<body data-theme="starry">
  <main id="library" class="screen">
    <div class="brand-row"><div class="brand"><div class="mark">阅</div><div><h1>阅见</h1><div class="tagline">在字里行间，遇见更辽阔的世界</div></div></div><button class="icon-btn" onclick="app.showAbout()" aria-label="关于">⋯</button></div>
    <section class="hero"><h2>把一本好书，装进口袋</h2><p>支持 EPUB 与 TXT，本地保存，离线也能安静阅读。</p><button class="primary" onclick="app.chooseBook()">＋ 导入书籍</button></section>
    <div class="section-title"><h2>我的书架</h2><span id="bookCount" class="count"></span></div>
    <section id="bookGrid" class="grid"></section>
  </main>
  <main id="reader" class="hidden">
    <header class="reader-head"><button class="back" onclick="app.closeReader()" aria-label="返回">‹</button><div class="reader-title"><strong id="readerBookTitle"></strong><span id="readerChapterTitle"></span></div><div class="head-actions"><button onclick="app.addNote()" aria-label="批注">✎</button><button onclick="app.toggleBookmark()" id="bookmarkBtn" aria-label="书签">♧</button><button onclick="app.openSettings()" aria-label="设置">Aa</button></div></header>
    <div id="readingScroll" class="reading-scroll"><article id="reading" class="reading"></article></div>
    <nav class="reader-foot"><button id="prevBtn" onclick="app.prevChapter()">上一章</button><button onclick="app.openToc()">目录</button><span id="chapterPage" class="chapter-page"></span><button id="nextBtn" onclick="app.nextChapter()">下一章</button></nav>
  </main>
  <div id="tocOverlay" class="overlay" onclick="app.closeToc(event)"><aside class="drawer"><h2>目录</h2><div id="toc" class="toc"></div></aside></div>
  <div id="settingsSheet" class="sheet-wrap" onclick="app.closeSettings(event)"><section class="sheet"><div class="grab"></div><div class="setting"><label><span>字号</span><span id="fontValue"></span></label><input id="fontRange" type="range" min="15" max="28" step="1" oninput="app.setFont(this.value)"></div><div class="setting"><label><span>行距</span><span id="lineValue"></span></label><input id="lineRange" type="range" min="15" max="25" step="1" oninput="app.setLine(this.value)"></div><div class="setting"><label><span>阅读主题</span></label><div class="themes"><button class="theme" data-theme="paper" onclick="app.setTheme('paper')"><i style="background:#f5efe5"></i>纸张</button><button class="theme" data-theme="green" onclick="app.setTheme('green')"><i style="background:#e8efe7"></i>护眼</button><button class="theme" data-theme="white" onclick="app.setTheme('white')"><i style="background:#fafafa"></i>纯白</button><button class="theme" data-theme="night" onclick="app.setTheme('night')"><i style="background:#171a1c"></i>夜间</button></div></div></section></div>
  <div id="busy" class="busy hidden"><div class="busy-card"><div class="spinner"></div><strong>正在整理书籍…</strong><div class="tagline">首次导入 EPUB 可能需要一点时间</div></div></div>
  <div id="toast" class="toast"></div>
  <script>
  const app={
    books:[],book:null,chapter:0,scrollTimer:null,
    init(){this.applyPrefs();this.refreshLibrary();document.addEventListener('visibilitychange',()=>{if(document.hidden)this.saveProgress()});},
    native(name,...args){if(!window.Yuejian||typeof Yuejian[name]!=='function')throw new Error('Android 接口不可用');return Yuejian[name](...args)},
    refreshLibrary(){try{this.books=JSON.parse(this.native('listBooks'));}catch(e){this.books=[]}const grid=document.getElementById('bookGrid');document.getElementById('bookCount').textContent=this.books.length+' 本';if(!this.books.length){grid.innerHTML='<div class="empty"><div class="empty-icon">▤</div><div>书架还是空的</div><small>点击上方按钮导入 EPUB 或 TXT</small></div>';return}grid.innerHTML=this.books.map(b=>`<button class="book" onclick="app.openBook('${b.id}')"><div class="cover ${b.type}"><div class="cover-title">${this.escape(b.title)}</div><div class="cover-type">${b.type.toUpperCase()}</div></div><div class="book-name">${this.escape(b.title)}</div><div class="progress-row"><div class="bar"><i style="width:${Math.round(b.progress*100)}%"></i></div><span>${Math.round(b.progress*100)}%</span></div></button>`).join('')},
    chooseBook(){this.native('chooseBook')},importStarted(){document.getElementById('busy').classList.remove('hidden')},
    importFinished(payload){document.getElementById('busy').classList.add('hidden');this.refreshLibrary();let book=typeof payload==='string'?JSON.parse(payload):payload;this.toast('《'+book.title+'》已加入书架');this.openBook(book.id)},
    importFailed(message){document.getElementById('busy').classList.add('hidden');this.toast(message||'导入失败')},
    openBook(id){try{const b=JSON.parse(this.native('openBook',id));if(b.error)throw new Error(b.error);this.book=b;this.chapter=Math.min(b.currentChapter||0,b.chapters.length-1);document.getElementById('library').classList.add('hidden');document.getElementById('reader').classList.remove('hidden');document.getElementById('readerBookTitle').textContent=b.title;this.renderToc();this.loadChapter(this.chapter,false)}catch(e){this.toast(e.message)}},
    loadChapter(index,savePrevious=true){if(!this.book||index<0||index>=this.book.chapters.length)return;if(savePrevious)this.saveProgress();this.chapter=index;let data;try{data=JSON.parse(this.native('readChapter',this.book.id,index));if(data.error)throw new Error(data.error)}catch(e){this.toast(e.message);return}const host=document.getElementById('reading');this.renderContent(host,data.html,data.base);document.getElementById('readerChapterTitle').textContent=data.title;document.getElementById('chapterPage').textContent=(index+1)+' / '+this.book.chapters.length;document.getElementById('prevBtn').disabled=index===0;document.getElementById('nextBtn').disabled=index===this.book.chapters.length-1;document.getElementById('readingScroll').scrollTop=0;this.updateToc();this.updateBookmark();this.native('saveProgress',this.book.id,index,index/this.book.chapters.length);document.getElementById('readingScroll').onscroll=()=>{clearTimeout(this.scrollTimer);this.scrollTimer=setTimeout(()=>this.saveProgress(),500)}},
    renderContent(host,html,base){const doc=new DOMParser().parseFromString(html,'text/html'),allowed=new Set('P H1 H2 H3 H4 H5 H6 SPAN DIV BR HR IMG B I EM STRONG U S MARK BLOCKQUOTE PRE CODE UL OL LI DL DT DD TABLE THEAD TBODY TR TH TD SUP SUB A RUBY RT RP FIGURE FIGCAPTION'.split(' ')),attrs=new Set('src href alt title width height colspan rowspan lang dir id'.split(' '));doc.querySelectorAll('script,style,iframe,object,embed,form,meta,base,link,svg,math,template').forEach(el=>el.remove());[...doc.body.querySelectorAll('*')].forEach(el=>{if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}[...el.attributes].forEach(a=>{if(!attrs.has(a.name.toLowerCase())||/javascript:|data:text\/html/i.test(a.value))el.removeAttribute(a.name)})});this.rebase(doc.body,base);host.replaceChildren(...doc.body.childNodes)},
    rebase(root,base){root.querySelectorAll('[src]').forEach(el=>{const v=el.getAttribute('src');if(v&&!/^(data:|https?:|#)/i.test(v))el.src=new URL(v,base).href});root.querySelectorAll('a[href]').forEach(el=>{const v=el.getAttribute('href');if(v&&!/^(https?:|#|mailto:)/i.test(v))el.href=new URL(v,base).href;el.onclick=e=>e.preventDefault()})},
    saveProgress(){if(!this.book)return;const sc=document.getElementById('readingScroll'),within=sc.scrollHeight<=sc.clientHeight?1:sc.scrollTop/(sc.scrollHeight-sc.clientHeight),overall=(this.chapter+within)/this.book.chapters.length;this.native('saveProgress',this.book.id,this.chapter,overall)},
    closeReader(){this.saveProgress();this.book=null;document.getElementById('reader').classList.add('hidden');document.getElementById('library').classList.remove('hidden');this.refreshLibrary()},prevChapter(){this.loadChapter(this.chapter-1)},nextChapter(){this.loadChapter(this.chapter+1)},
    renderToc(){document.getElementById('toc').innerHTML=this.book.chapters.map((c,i)=>`<button data-i="${i}" onclick="app.jump(${i})">${this.escape(c.title)}</button>`).join('')},updateToc(){document.querySelectorAll('#toc button').forEach((b,i)=>b.classList.toggle('active',i===this.chapter))},jump(i){this.loadChapter(i);document.getElementById('tocOverlay').classList.remove('show')},openToc(){document.getElementById('tocOverlay').classList.add('show')},closeToc(e){if(e.target.id==='tocOverlay')e.currentTarget.classList.remove('show')},
    openSettings(){document.getElementById('settingsSheet').classList.add('show')},closeSettings(e){if(e.target.id==='settingsSheet')e.currentTarget.classList.remove('show')},
    applyPrefs(){const p=JSON.parse(localStorage.getItem('readerPrefs')||'{}');this.setFont(p.font||19,false);this.setLine(p.line||19.5,false);this.setTheme(p.theme||'starry',false)},prefs(){return{font:+document.getElementById('fontRange').value,line:+document.getElementById('lineRange').value,theme:document.body.dataset.theme}},savePrefs(){localStorage.setItem('readerPrefs',JSON.stringify(this.prefs()))},setFont(v,save=true){document.documentElement.style.setProperty('--reader-size',v+'px');document.getElementById('fontRange').value=v;document.getElementById('fontValue').textContent=v+' px';if(save)this.savePrefs()},setLine(v,save=true){document.documentElement.style.setProperty('--reader-line',v/10);document.getElementById('lineRange').value=v;document.getElementById('lineValue').textContent=(v/10).toFixed(1);if(save)this.savePrefs()},setTheme(v,save=true){document.body.dataset.theme=v;document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('active',b.dataset.theme===v));if(save)this.savePrefs()},
    bookmarkKey(){return this.book?'bookmark:'+this.book.id+':'+this.chapter:''},toggleBookmark(){if(!this.book)return;const key=this.bookmarkKey(),on=localStorage.getItem(key)==='1';if(on)localStorage.removeItem(key);else localStorage.setItem(key,'1');this.updateBookmark();this.toast(on?'已移除书签':'已添加书签')},updateBookmark(){document.getElementById('bookmarkBtn').textContent=localStorage.getItem(this.bookmarkKey())==='1'?'♥':'♧'},
    notesKey(){return this.book?'notes:'+this.book.id:''},addNote(){if(!this.book)return;const quote=String(getSelection()).trim();const notes=JSON.parse(localStorage.getItem(this.notesKey())||'[]');if(!quote){const current=notes.filter(n=>n.chapter===this.chapter);alert(current.length?current.map((n,i)=>(i+1)+'. '+n.quote+'\n'+(n.note||'')).join('\n\n'):'请先长按选择一段文字，再点击批注按钮');return}const note=prompt('为这段文字添加批注：\n“'+quote.slice(0,120)+'”','');if(note===null)return;notes.push({chapter:this.chapter,quote:quote.slice(0,500),note:note.trim(),created:Date.now()});localStorage.setItem(this.notesKey(),JSON.stringify(notes));getSelection().removeAllRanges();this.toast('批注已保存')},
    showAbout(){this.toast('阅见 Android 1.1.2 · 数据仅保存在本机')},handleBack(){if(document.getElementById('settingsSheet').classList.contains('show')){document.getElementById('settingsSheet').classList.remove('show');return true}if(document.getElementById('tocOverlay').classList.contains('show')){document.getElementById('tocOverlay').classList.remove('show');return true}if(this.book){this.closeReader();return true}return false},toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>el.classList.remove('show'),2500)},escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  };window.app=app;window.addEventListener('DOMContentLoaded',()=>app.init());
  </script>
  <link rel="stylesheet" href="/reader-enhancements.css">
  <script src="/features.js"></script>
  <script src="/reader-enhancements.js"></script>
</body>
</html>
