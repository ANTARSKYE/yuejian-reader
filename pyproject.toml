[project]
name = "yuejian-reader"
version = "1.3.1"
description = "Windows local-first AI ebook reader"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pywebview==6.2.1",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.21.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
